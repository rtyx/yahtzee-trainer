<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahtzee Trainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='7' width='50' height='50' rx='8' fill='%23f8f3e7' stroke='%2326221c' stroke-width='4'/%3E%3Ccircle cx='22' cy='22' r='4.5' fill='%2326221c'/%3E%3Ccircle cx='42' cy='22' r='4.5' fill='%2326221c'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%2326221c'/%3E%3Ccircle cx='22' cy='42' r='4.5' fill='%2326221c'/%3E%3Ccircle cx='42' cy='42' r='4.5' fill='%2326221c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (() => {
      let preference = 'system';
      try {
        const raw = localStorage.getItem('yahtzee_settings');
        preference = raw ? JSON.parse(raw).theme || 'system' : localStorage.getItem('theme') || 'system';
      } catch (_) {}
      document.documentElement.dataset.themePreference = preference;
      document.documentElement.dataset.theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : preference;
    })();
  </script>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p class="loading-text">Preparing the score sheet…</p>
  </div>

  <div id="app" class="hidden">

    <header>
      <div class="brand">
        <span class="brand-mark">Yahtzee Trainer</span>
        <span class="brand-sub">optimal play, explained</span>
      </div>
      <button id="btn-restart" class="btn-restart">↺ New game</button>
      <button id="btn-settings" class="btn-settings" aria-haspopup="dialog" aria-controls="settings-dialog">Settings</button>
      <div class="stats">
        <div class="stat">
          <span id="stat-turn-val" class="stat-value">1/13</span>
          <span class="stat-label">Turn</span>
        </div>
        <div class="stat">
          <span id="stat-score-val" class="stat-value">0</span>
          <span class="stat-label">Score</span>
        </div>
        <div class="stat">
          <span id="stat-acc-val" class="stat-value">—</span>
          <span class="stat-label stat-label--tip" data-tip="% of keep &amp; score decisions matching optimal play">Accuracy</span>
        </div>
      </div>
    </header>

    <nav class="mobile-tabs" role="tablist" aria-label="Mobile game views">
      <button id="tab-scorecard" class="mobile-tab" type="button" role="tab" aria-selected="false" aria-controls="scorecard-panel">Scorecard</button>
      <button id="tab-dice" class="mobile-tab" type="button" role="tab" aria-selected="true" aria-controls="game-panel">Dice</button>
    </nav>

    <main>

      <section id="scorecard-panel" class="scorecard-panel" role="tabpanel" aria-labelledby="tab-scorecard">
        <div id="scorecard-body" class="scorecard-body"></div>
      </section>

      <section id="game-panel" class="game-panel" role="tabpanel" aria-labelledby="tab-dice">

        <div class="dice-section">
          <div id="dice-board" aria-label="Dice rolling box">
            <div id="dice-arena" aria-hidden="true"></div>
            <div id="held-dice-tray" aria-hidden="true">
              <span class="tray-label">Held dice</span>
            </div>
            <div id="dice-container"></div>
          </div>
          <div id="phase-label" class="phase-label"></div>
        </div>

        <div class="controls">
          <button id="btn-reroll" class="btn btn-gold hidden"></button>
          <button id="btn-continue" class="btn btn-outline hidden">Got it</button>
        </div>

        <div id="feedback-wrap" class="feedback-wrap">
          <div class="feedback-inner">
            <div id="feedback-panel" class="feedback-panel"></div>
          </div>
        </div>

        <div id="turn-history" class="turn-history"></div>

        <div id="all-games-wrap" class="all-games-wrap hidden">
          <div class="all-games-head">Past games</div>
          <div id="all-games-history" class="all-games-history"></div>
        </div>

      </section>

    </main>

    <aside id="keyboard-help" class="keyboard-help" aria-live="polite" aria-hidden="true"></aside>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-head">
        <div>
          <h2 id="settings-title">Settings</h2>
          <p>Game rules and table preferences</p>
        </div>
        <button id="btn-settings-close" class="btn-icon" aria-label="Close settings">×</button>
      </div>

      <div class="settings-body">
        <fieldset class="settings-field">
          <legend>Full House</legend>
          <label class="option-row">
            <input type="radio" name="full-house-score" value="fixed">
            <span>
              <strong>Fixed 25 points</strong>
              <small>Classic trainer scoring</small>
            </span>
          </label>
          <label class="option-row">
            <input type="radio" name="full-house-score" value="sum">
            <span>
              <strong>Nominal dice total</strong>
              <small>Score the dice that form the house</small>
            </span>
          </label>
        </fieldset>

        <fieldset class="settings-field">
          <legend>Scorecard</legend>
          <label class="switch-row">
            <span>
              <strong>Use 2 Paar</strong>
              <small>Show the two-pairs category</small>
            </span>
            <input id="setting-two-pairs" type="checkbox">
          </label>
          <label class="switch-row">
            <span>
              <strong>Preview possible scores</strong>
              <small>Show category points when choosing a score</small>
            </span>
            <input id="setting-preview-potential" type="checkbox">
          </label>
          <label class="switch-row">
            <span>
              <strong>Show upper sum</strong>
              <small>Display upper-section progress before the game ends</small>
            </span>
            <input id="setting-upper-sum" type="checkbox">
          </label>
          <label class="switch-row">
            <span>
              <strong>Show final sum</strong>
              <small>Display the running total before the game ends</small>
            </span>
            <input id="setting-final-sum" type="checkbox">
          </label>
        </fieldset>

        <fieldset class="settings-field">
          <legend>Preferences</legend>
          <label class="switch-row">
            <span>
              <strong>Sound effects</strong>
              <small>Rolls, marks, and feedback tones</small>
            </span>
            <input id="setting-sound" type="checkbox">
          </label>
          <div class="theme-options" role="radiogroup" aria-label="Theme">
            <label><input type="radio" name="theme" value="system"><span>System</span></label>
            <label><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-field danger-field">
          <legend>History</legend>
          <button id="btn-delete-history" class="btn-danger">Delete history</button>
        </fieldset>
      </div>

      <div class="settings-actions">
        <button id="btn-settings-save" class="btn btn-gold">Save settings</button>
      </div>
    </dialog>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
